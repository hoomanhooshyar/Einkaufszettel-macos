name: Android CI/CD

# این اکشن روی شاخه اصلی و همچنین وقتی تگ ورژن (مثل v1.0.0) می‌زنیم اجرا می‌شود
on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      # 👈 تغییر مهم: ساخت نسخه Release به جای Debug
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 👈 تغییر اسم فایل دانلودی برای اینکه بدانید نسخه Release است
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufszettel-Release-APK
          path: '**/*.apk'

      # مرحله CD: ساخت ریلیز رسمی (فقط وقتی تگ ورژن بزنیم اجرا می‌شود)
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/*.apk'