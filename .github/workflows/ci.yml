name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 👈 اضافه شده: بازسازی فایل فایربیس قبل از تست و بیلد
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > composeApp/google-services.json

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      # 👈 ۱. تبدیل متنِ طولانی گیت‌هاب به فایل واقعی Keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # 👈 ۲. بیلد و امضای همزمان فایل با استفاده از خود گریدل
      - name: Build & Sign Release APK
        run: >
          ./gradlew assembleRelease 
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks 
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} 
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} 
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} 
          --stacktrace

      # 👈 ۳. آپلود فایل امضا شده نهایی
      - name: Upload Signed APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufszettel-Release-APK
          path: '**/*.apk'

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/*.apk'