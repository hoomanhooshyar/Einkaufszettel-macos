name: Android CI/CD

# این اکشن روی شاخه اصلی و همچنین وقتی تگ ورژن (مثل v1.0.0) می‌زنیم اجرا می‌شود
on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

# گیت‌هاب برای ساخت ریلیز به دسترسی نوشتن نیاز دارد
permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          # ⚠️ توجه: اگر اسم ماژول اصلی اندروید شما در پروژه composeApp نیست و مثلا app است، کلمه composeApp در خط زیر را به app تغییر دهید
          releaseDirectory: composeApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufszettel-Release-Signed-APK
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{steps.sign_app.outputs.signedReleaseFile}}