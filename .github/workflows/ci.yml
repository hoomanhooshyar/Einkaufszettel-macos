name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > composeApp/google-services.json

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # 👈 دستور از assembleRelease به bundleRelease تغییر کرد تا فایل AAB ساخته شود
      - name: Build & Sign Release AAB
        run: >
          ./gradlew bundleRelease 
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks 
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} 
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} 
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} 
          --stacktrace

      # 👈 آپلود در محیط خود گیت‌هاب (به پسوند aab تغییر کرد)
      - name: Upload Signed AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufszettel-Release-AAB
          path: '**/*.aab'

      - name: Publish Release on GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/*.aab'


      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: com.hooman.einkaufszettel
          releaseFiles: composeApp/build/outputs/bundle/release/*.aab
          track: internal # می‌توانید به alpha یا production تغییر دهید
          status: completed